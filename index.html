      body {
        margin: 0;
        font-family: Arial, sans-serif;

        flex-direction: column;
        overflow: hidden;
      }
      .container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }
      .top-sections {
        display: flex;
        flex: 1;
        overflow: hidden;
      }
      .left,
      .right {
        flex: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
      }

      .header {
        background-color: #b0c4de;
        #padding: 10px;
        padding: 5px;
        text-align: center;
        font-weight: bold;
        flex-shrink: 0;
      }
      .header_bottom {
        background-color: #b0c4de;
        #padding: 10px;
        padding: 5px;
        text-align: left;
        font-weight: bold;
        flex-shrink: 0;
      }
      .content {
        flex: 1;
        overflow-y: auto; /* Enables independent scrolling */
        #padding: 20px;
        padding: 10px;
        box-sizing: border-box;
        background-color: #f0f8ff;
        flex-direction: column; /* Arranges items vertically */
        ##display: flex; /* Enables flexbox layout */
        gap: 10px; /* Adds spacing between tiles */
        align-items: left; /* Centers tiles horizontally (optional) */
      }

      .right .content {
        background-color: #faebd7;
      }
      .bottom {
        background-color: #d3d3d3;
        #padding: 20px;
        padding: 5px;
        display: flex;
        #gap: 10px;
        gap: 5px;
        justify-content: left;
        align-items: left;
        box-sizing: border-box;
        flex-shrink: 0;
        #height: 150px; /* Fixed height */
        height: 75px; /* Fixed height */
        overflow-y: auto; /* Enables independent scrolling */
        flex-wrap: wrap;
      }
      .drop-box {
        #width: 80px;
        #height: 80px;
        width: 60px;
        height: 60px;
        background-color: #ffffff;
        border: 2px dashed #aaa;
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
      }
      .drop-box img {
        max-width: 100%;
        max-height: 100%;
        cursor: pointer;
      }
      .drop-box .remove-box {
        position: absolute;
        top: -5px;
        right: -5px;
        width: 20px;
        height: 20px;
        background-color: black;
        color: white;
        font-size: 14px;
        font-weight: bold;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .drag-item {
        width: 100px;
        height: 100px;
        background-color: #e6f7ff;
        border: 1px solid #ccc;
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: grab;
      }
      .add-box {
        width: 40px;
        height: 40px;
        background-color: #add8e6;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        font-size: 24px;
        font-weight: bold;
        color: #ffffff;
      }
      iframe {
        width: 400px; /* Full width of the iframe content */
        height: 200px; /* Full height of the iframe content */
        transform: scale(0.5); /* Optional zoom */
      }
    </style>

    <script>
      const dragItems = document.querySelectorAll(".drag-item");
      const bottomSection = document.getElementById("bottomSection");
      const bottomSoundSection = document.getElementById("bottomSoundSection");

      const addBoxButton = document.getElementById("addBox");
      const addSoundBoxButton = document.getElementById("addBox_Sound");

      dragItems.forEach((item) => {
        item.addEventListener("dragstart", (e) => {
          e.dataTransfer.setData(
            "text/plain",
            e.target.getAttribute("data-image")
          );
        });
      });

      function enableDrop(box) {
        box.addEventListener("dragover", (e) => {
          e.preventDefault();
          box.style.backgroundColor = "#f0f8ff";
        });

        box.addEventListener("dragleave", () => {
          box.style.backgroundColor = "#ffffff";
        });

        box.addEventListener("drop", (e) => {
          e.preventDefault();
          const imageUrl = e.dataTransfer.getData("text/plain");
          const img = document.createElement("img");
          img.src = imageUrl;
          img.addEventListener("click", () => {
            img.remove();
          });
          box.innerHTML = "";
          box.appendChild(img);
          box.style.backgroundColor = "#ffffff";
        });
      }

      addBoxButton.addEventListener("click", () => {
        const newDropBox = document.createElement("div");
        newDropBox.classList.add("drop-box");
        const removeButton = document.createElement("button");
        removeButton.textContent = "x";
        removeButton.classList.add("remove-box");
        removeButton.addEventListener("click", () => {
          newDropBox.remove();
        });
        newDropBox.appendChild(removeButton);
        enableDrop(newDropBox);
        bottomSection.insertBefore(newDropBox, addBoxButton);
      });
      addSoundBoxButton.addEventListener("click", () => {
        const newDropBox = document.createElement("div");
        newDropBox.classList.add("drop-box");
        const removeButton = document.createElement("button");
        removeButton.textContent = "x";
        removeButton.classList.add("remove-box");
        removeButton.addEventListener("click", () => {
          newDropBox.remove();
        });
        newDropBox.appendChild(removeButton);
        enableDrop(newDropBox);
        bottomSoundSection.insertBefore(newDropBox, addSoundBoxButton);
      });

      document.querySelectorAll(".drop-box").forEach(enableDrop);
    </script>
