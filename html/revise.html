<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jolly_Phonics</title>
    <link rel="stylesheet" href="../styles/board_style.css">
  </head>
  <body>
	<style>
       <style>
    .image-container {
        text-align: center;
        margin-top: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        ##height: 400px; /* Set a height for the container */
        background-color: #f9f9f9; /* Optional: Add a background to distinguish the area */
        border: 1px solid #ddd; /* Optional: Add a border */
    }

    .image-container img {
        max-width: 100%;
        max-height: 100%;
        transition: transform 0.3s ease; /* Smooth zoom effect */
        cursor: pointer; /* Change cursor to indicate interactivity */
		transform: scale(2.0); /* Zoom in by 20% on hover */
    }

    .image-container img:hover {
        
    }
</style>

    </style>
  
    <div class="container">
		<header class="header">
			<div class="header-title">Revise Sounds</div>
			<a href="../index.html" class="home-icon" title="Go to Main Page">
                &#8962; <!-- Unicode for home icon -->
            </a>
		</header>
		<div class="image-container">
			<img src="" alt="Image" class="active">
		</div>
		 <div class="controls">
            <button id="prevBtn">Previous</button>
            <button id="nextBtn">Next</button>
        </div>
	</div>
	
	<script>
    // Define the list of images
    const images = [
        "../images/poster_images/1_s_snake.png",
        "../images/poster_images/2_a_ants.png",
        "../images/poster_images/2_a_ants.png",
        "../images/poster_images/3_t_tennis.png"
    ];

    // Initialize variables
    const imageContainer = document.querySelector('.image-container img');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    let currentIndex = 0;

    // Function to update the displayed image
    function updateImage() {
        imageContainer.src = images[currentIndex];
        imageContainer.alt = `Image ${currentIndex + 1}`;
		console.log("updateImage"+imageContainer.src);
    }

    // Event listeners for buttons
    nextBtn.addEventListener('click', () => {
        currentIndex = (currentIndex + 1) % images.length; // Loop to the first image
        updateImage();
    });

    prevBtn.addEventListener('click', () => {
        currentIndex = (currentIndex - 1 + images.length) % images.length; // Loop to the last image
        updateImage();
    });

    // Initialize with the first image
    updateImage();
</script>
</body>
